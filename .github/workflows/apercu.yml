# Publie l'aperçu statique du design system sur GitHub Pages.
#
# Pourquoi une action plutôt qu'un dossier commité : l'aperçu pèse 2,3 Mo de
# binaires et se régénère à chaque build. Le committer chargerait l'historique
# pour un bundle minifié qu'aucun agent ne sait lire et que GitHub n'affiche
# pas de lui-même. Ici il est construit à la demande et publié, sans jamais
# entrer dans le dépôt.
name: Aperçu du design system

on:
  push:
    branches: [main]
  # Permet de republier à la main sans attendre un commit.
  workflow_dispatch:

# Une seule publication à la fois ; une nouvelle annule celle en cours.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `--base` doit valoir le chemin où Pages sert le site, sinon les
      # fichiers sont cherchés à la racine du domaine et la page reste vide.
      # C'est exactement le piège rencontré en local.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          NODE_ENV: production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/preview

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
